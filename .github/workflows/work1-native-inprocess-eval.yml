name: Work1 native in-process spatial evaluator
on:
  push:
    branches:
      - work/inprocess-2d-leveling-world-20261108
    paths:
      - src/core/fight.rs
      - src/core/fight/world_bridge.rs
      - src/core/fight/world_bridge/spatial.rs
      - src/engine/prepared.rs
      - src/lib.rs
      - src/main.rs
      - .github/workflows/work1-native-inprocess-eval.yml
  workflow_dispatch:

jobs:
  native-spatial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and execute real native spatial ACK transitions
        run: |
          cargo test --locked --lib inprocess_spatial_ack_tests -- --nocapture
          cargo test --locked --lib world_damage_receipt_uses_true_native_target_index -- --nocapture
          cargo test --locked --lib nested_native_spatial_start_refuses_without_overwriting_paid_source -- --nocapture
          cargo test --locked --lib rejected_native_start_cleanup_preserves_external_paid_ack_session -- --nocapture
          cargo test --locked --lib native_spatial_chain_refuses_dead_actor_before_next_native_action -- --nocapture
          cargo test --locked --lib native_spatial_chain_refuses_actor_killed_during_hostile_step -- --nocapture
          cargo test --locked --lib native_paid_recovery_never_resurrects_a_dead_actor -- --nocapture
          cargo test --locked --lib native_paid_recovery_processes_existing_source_item_mana_ticks -- --nocapture
          cargo test --locked --lib native_inprocess_idle_recovery_keeps_source_ticks_without_movement_samples -- --nocapture
          cargo test --locked --lib matches_gsim_eight_target_chebyshev_ring_and_route
          cargo test --locked --bin forever-engine native_recovery_execution_identity_tracks_per_gap_policy -- --nocapture
          cargo check --locked --bin forever-engine
      - name: Run same-process eight-target source-prepared Warlock smoke
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('fixtures/mage/prepared-v2/affliction-warlock-broad.prepared.json')
          p = json.loads(path.read_text())
          # Small scenario-owned enemy HP, unchanged source-prepared Warlock
          # spell/APL/pet mechanics. This is NOT a gate or source reference.
          p['target']['stats']['Health'] = 300.0
          p['scenario_id'] = 'work1-native-spatial-eight-target-smoke'
          Path('/tmp/work1-spatial-smoke.json').write_text(json.dumps(p))
          PY
          cargo run --locked -- eval-leveling --infile /tmp/work1-spatial-smoke.json --targets 8 --rng-mode balanced --recovery-seconds 12 > /tmp/work1-spatial-out.json
          python3 - <<'PY'
          import json
          o = json.load(open('/tmp/work1-spatial-out.json'))
          r = o['result']
          execution = o['native_execution']
          source = json.load(open('/tmp/work1-spatial-smoke.json'))
          # Execution metadata must distinguish native protocol, seed and
          # scenario from the original source request hash. A route cache must
          # also hash exact prepared input, recovery schedule and engine SHA.
          assert execution == {
              'protocol': 'native-inprocess-spatial-v1',
              'rng_mode': 'balanced',
              'seed': source['sim']['seed'],
              'scenario_id': source['scenario_id'],
              'declared_reference_revision': source['reference']['engine_revision'],
              'target_count': 8,
              'recovery_policy': {
                  'explicit_schedule': False,
                  'effective_seconds_per_gap': [12] * 7,
              },
              'complete_cache_key': False,
          }, execution
          assert o['source_sha256'] == source['request_sha256'], o
          assert r['native_spatial_inprocess'] is True, r
          assert r['actual_2d_ack'] is False, r
          assert r['world_targets_killed'] == 8, r
          assert len(r['windows']) == 8, r
          # Every native source-paid target reports a genuine combat interval,
          # not a guessed fraction of the kill-to-kill timeline. Across the
          # retained route, prior kill + charged recovery == next pull start.
          windows = r['windows']
          assert all(w['native_combat_elapsed_ns'] > 0 and
                     w['native_pull_started_ns'] + w['native_combat_elapsed_ns']
                     == w['native_kill_ns'] for w in windows), r
          assert all(current['native_pull_started_ns']
                     == previous['native_kill_ns'] + current['native_passive_recovery_ns']
                     for previous, current in zip(windows, windows[1:])), r
          # Measure actual native regeneration across each paid gap. A World
          # optimizer must not substitute its own health/mana recovery model.
          import math
          # The native source counters are partitioned at each real pull:
          # charged travel/rest cannot be mislabeled as in-combat regen.
          for w in r['windows']:
              assert math.isclose(
                  w['native_total_mana_regen_actual_gain'],
                  w['native_recovery_mana_regen_actual_gain']
                  + w['native_combat_mana_regen_actual_gain'],
                  rel_tol=1e-9, abs_tol=1e-8), w
              assert (w['native_total_mana_regen_events']
                      == w['native_recovery_mana_regen_events']
                      + w['native_combat_mana_regen_events']), w
              assert w['native_recovery_mana_regen_actual_gain'] >= 0, w
              assert w['native_combat_mana_regen_actual_gain'] >= 0, w
              # Item-mana receipts must come from executed native scheduler
              # actions, not inferred food/drink or passive mana gain.
              assert isinstance(w['native_scheduled_item_mana_ticks'], int), w
              assert w['native_scheduled_item_mana_ticks'] >= 0, w
              assert math.isfinite(w['native_scheduled_item_mana_actual_gain']), w
              assert w['native_scheduled_item_mana_actual_gain'] >= 0, w
          assert r['windows'][0]['native_recovery_health_delta'] == 0.0, r
          assert r['windows'][0]['native_recovery_mana_delta'] == 0.0, r
          for previous, current in zip(r['windows'], r['windows'][1:]):
              assert math.isclose(
                  current['native_actor_health_at_pull'],
                  previous['actor_health'] + current['native_recovery_health_delta'],
                  abs_tol=1e-6), (previous, current)
              assert math.isclose(
                  current['native_actor_mana_at_pull'],
                  previous['actor_mana'] + current['native_recovery_mana_delta'],
                  abs_tol=1e-6), (previous, current)
          spatial = [w['native_spatial_position'] for w in r['windows']]
          assert [p['target_source_index'] for p in spatial] == list(range(8)), spatial
          assert all(len(p['target_xy_yards']) == len(p['actor_xy_yards']) == 2 for p in spatial)
          assert all(p['distance_yards'] >= 0 for p in spatial), spatial
          assert any(w['native_spatial_travel_ns'] > 0 for w in r['windows'][1:]), r
          # An in-range mob needs no walk. Every actual paid walk, including
          # sub-100ms legs, must still be seen as moving on the native clock.
          assert all(w['native_spatial_moving_samples'] > 0
                     for w in r['windows'][1:] if w['native_spatial_travel_ns'] > 0), r
          assert all(w['native_damage'] > 0 for w in r['windows']), r
          print('WORK1_NATIVE_INPROCESS_EIGHT_TARGETS',
                {'kills': r['world_targets_killed'],
                 'last_kill_ns': r['windows'][-1]['native_kill_ns'],
                 'travel_ns': sum(w['native_spatial_travel_ns'] for w in r['windows'])})
          PY
      - name: Execute eight native kills with no forced between-pull rest
        run: |
          cargo run --locked -- eval-leveling --infile /tmp/work1-spatial-smoke.json --targets 8 --rng-mode balanced --recovery-seconds 0 > /tmp/work1-spatial-no-rest.json
          python3 - <<'PY'
          import json
          r = json.load(open('/tmp/work1-spatial-no-rest.json'))['result']
          assert r['native_spatial_inprocess'] is True, r
          assert r['world_targets_killed'] == 8, r
          assert r['recovery_seconds_per_gap'] == 0, r
          # A chain-pull need not receive a passive regen tick to have
          # charged the chosen zero-rest policy and native spatial travel.
          assert r['paid_recovery'] is True, r
          windows = r['windows']
          assert len(windows) == 8, r
          assert all(w['native_damage'] > 0 for w in windows), r
          import math
          # The native source counters are partitioned at each real pull:
          # charged travel/rest cannot be mislabeled as in-combat regen.
          for w in r['windows']:
              assert math.isclose(
                  w['native_total_mana_regen_actual_gain'],
                  w['native_recovery_mana_regen_actual_gain']
                  + w['native_combat_mana_regen_actual_gain'],
                  rel_tol=1e-9, abs_tol=1e-8), w
              assert (w['native_total_mana_regen_events']
                      == w['native_recovery_mana_regen_events']
                      + w['native_combat_mana_regen_events']), w
              assert w['native_recovery_mana_regen_actual_gain'] >= 0, w
              assert w['native_combat_mana_regen_actual_gain'] >= 0, w
              # Item-mana receipts must come from executed native scheduler
              # actions, not inferred food/drink or passive mana gain.
              assert isinstance(w['native_scheduled_item_mana_ticks'], int), w
              assert w['native_scheduled_item_mana_ticks'] >= 0, w
              assert math.isfinite(w['native_scheduled_item_mana_actual_gain']), w
              assert w['native_scheduled_item_mana_actual_gain'] >= 0, w
          for previous, current in zip(windows, windows[1:]):
              assert math.isclose(
                  current['native_actor_health_at_pull'],
                  previous['actor_health'] + current['native_recovery_health_delta'],
                  abs_tol=1e-6), (previous, current)
              assert math.isclose(
                  current['native_actor_mana_at_pull'],
                  previous['actor_mana'] + current['native_recovery_mana_delta'],
                  abs_tol=1e-6), (previous, current)
          # One millisecond is the actual ACK/next-target clock transition;
          # there must be no extra mandatory one-second rest. Spatial
          # travel remains fully charged on the retained native clock.
          assert all(w['native_passive_recovery_ns']
                     == 1_000_000 + w['native_spatial_travel_ns']
                     for w in windows[1:]), r
          assert all(w['native_kill_ns'] > prev['native_kill_ns']
                     for prev, w in zip(windows, windows[1:])), r
          assert all(w['native_spatial_moving_samples'] > 0
                     for w in windows[1:] if w['native_spatial_travel_ns'] > 0), r
          print('WORK1_NATIVE_ZERO_REST_EIGHT_TARGETS',
                {'kills': r['world_targets_killed'],
                 'charged_gap_ns': sum(w['native_passive_recovery_ns']
                                       for w in windows[1:]),
                 'travel_ns': sum(w['native_spatial_travel_ns']
                                  for w in windows[1:])})
          PY
      - name: Exercise variable native recovery decisions on eight real kills
        run: |
          python3 - <<'PY'
          import json
          json.dump([0, 12, 0, 12, 0, 12, 0], open('/tmp/work1-recovery-schedule.json', 'w'))
          PY
          cargo run --locked -- eval-leveling --infile /tmp/work1-spatial-smoke.json --targets 8 --rng-mode balanced --recovery-schedule /tmp/work1-recovery-schedule.json > /tmp/work1-scheduled-out.json
          python3 - <<'PY'
          import json, subprocess
          schedule = [0, 12, 0, 12, 0, 12, 0]
          o = json.load(open('/tmp/work1-scheduled-out.json'))
          r = o['result']
          assert o['native_execution']['recovery_policy'] == {
              'explicit_schedule': True,
              'effective_seconds_per_gap': schedule,
          }, o['native_execution']
          assert r['world_targets_killed'] == 8, r
          assert r['recovery_seconds_per_gap'] is None, r
          assert r['recovery_schedule_seconds_per_gap'] == schedule, r
          assert [w['native_requested_recovery_seconds'] for w in r['windows'][1:]] == schedule, r
          # Mixed no-rest / 12s rest is fully charged even when one gap has
          # zero native passive-tick events. Tick and item gains stay distinct.
          assert r['paid_recovery'] is True, r
          assert all(w['native_damage'] > 0 for w in r['windows']), r
          for chosen, w in zip(schedule, r['windows'][1:]):
              assert w['native_passive_recovery_ns'] == max(
                  chosen * 1_000_000_000,
                  1_000_000 + w['native_spatial_travel_ns']), w
          for bad, reason in [([0], 'RUST_WORLD_RECOVERY_SCHEDULE_LENGTH_INVALID'),
                              ([121] * 7, 'RUST_WORLD_RECOVERY_SECONDS_INVALID')]:
              path = '/tmp/work1-invalid-schedule.json'
              json.dump(bad, open(path, 'w'))
              p = subprocess.run(['target/debug/forever-engine', 'eval-leveling',
                  '--infile', '/tmp/work1-spatial-smoke.json', '--targets', '8',
                  '--rng-mode', 'balanced', '--recovery-schedule', path],
                  text=True, capture_output=True)
              assert p.returncode != 0 and reason in p.stderr, (p.returncode, p.stderr)
          print('WORK1_NATIVE_VARIABLE_RECOVERY_8_8', {'schedule': schedule,
                'last_kill_ns': r['windows'][-1]['native_kill_ns']})
          PY
      - name: Exercise same native actor over one hundred serial spatial targets
        run: |
          cargo run --locked -- eval-leveling --infile /tmp/work1-spatial-smoke.json --targets 100 --rng-mode balanced --recovery-seconds 12 > /tmp/work1-spatial-100-out.json
          python3 - <<'PY'
          import json
          o = json.load(open('/tmp/work1-spatial-100-out.json'))
          r = o['result']
          assert o['native_execution']['target_count'] == 100, o['native_execution']
          assert o['native_execution']['protocol'] == 'native-inprocess-spatial-v1', o
          assert o['native_execution']['rng_mode'] == 'balanced', o
          assert o['native_execution']['recovery_policy'] == {
              'explicit_schedule': False,
              'effective_seconds_per_gap': [12] * 99,
          }, o['native_execution']
          assert r['native_spatial_inprocess'] is True, r
          assert r['actual_2d_ack'] is False, r
          assert r['world_targets_killed'] == 100, r
          assert len(r['windows']) == 100, r
          windows = r['windows']
          assert all(w['native_combat_elapsed_ns'] > 0 and
                     w['native_pull_started_ns'] + w['native_combat_elapsed_ns']
                     == w['native_kill_ns'] for w in windows), r
          assert all(current['native_pull_started_ns']
                     == previous['native_kill_ns'] + current['native_passive_recovery_ns']
                     for previous, current in zip(windows, windows[1:])), r
          assert all(w['native_damage'] > 0 for w in r['windows']), r
          import math
          # The native source counters are partitioned at each real pull:
          # charged travel/rest cannot be mislabeled as in-combat regen.
          for w in r['windows']:
              assert math.isclose(
                  w['native_total_mana_regen_actual_gain'],
                  w['native_recovery_mana_regen_actual_gain']
                  + w['native_combat_mana_regen_actual_gain'],
                  rel_tol=1e-9, abs_tol=1e-8), w
              assert (w['native_total_mana_regen_events']
                      == w['native_recovery_mana_regen_events']
                      + w['native_combat_mana_regen_events']), w
              assert w['native_recovery_mana_regen_actual_gain'] >= 0, w
              assert w['native_combat_mana_regen_actual_gain'] >= 0, w
              # Item-mana receipts must come from executed native scheduler
              # actions, not inferred food/drink or passive mana gain.
              assert isinstance(w['native_scheduled_item_mana_ticks'], int), w
              assert w['native_scheduled_item_mana_ticks'] >= 0, w
              assert math.isfinite(w['native_scheduled_item_mana_actual_gain']), w
              assert w['native_scheduled_item_mana_actual_gain'] >= 0, w
          for previous, current in zip(r['windows'], r['windows'][1:]):
              assert math.isclose(
                  current['native_actor_health_at_pull'],
                  previous['actor_health'] + current['native_recovery_health_delta'],
                  abs_tol=1e-6), (previous, current)
              assert math.isclose(
                  current['native_actor_mana_at_pull'],
                  previous['actor_mana'] + current['native_recovery_mana_delta'],
                  abs_tol=1e-6), (previous, current)
          assert sum(w['native_spatial_travel_ns'] for w in r['windows']) > 0, r
          # An in-range mob needs no walk. Every actual paid walk, including
          # sub-100ms legs, must still be seen as moving on the native clock.
          assert all(w['native_spatial_moving_samples'] > 0
                     for w in r['windows'][1:] if w['native_spatial_travel_ns'] > 0), r
          print('WORK1_NATIVE_INPROCESS_HUNDRED_TARGETS',
                {'kills': r['world_targets_killed'],
                 'last_kill_ns': r['windows'][-1]['native_kill_ns'],
                 'travel_ns': sum(w['native_spatial_travel_ns'] for w in r['windows']),
                 'last_health': r['windows'][-1]['actor_health'],
                 'last_mana': r['windows'][-1]['actor_mana']})
          PY
