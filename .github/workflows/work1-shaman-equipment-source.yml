name: Work1 Shaman equipment source import

on:
  push:
    branches:
      - "work/work1-shaman-l20-item-options-20261104"
    paths:
      - "tools/import_shaman_equipment.py"
      - "data/manifest.json"
      - ".github/workflows/work1-shaman-equipment-source.yml"
  pull_request:
    paths:
      - "tools/import_shaman_equipment.py"
      - "data/shaman-equipment-skills.json"
      - "data/shaman-equipment-skills.manifest.json"
      - "data/manifest.json"
      - ".github/workflows/work1-shaman-equipment-source.yml"

permissions:
  contents: read

jobs:
  import-pinned-client-skills:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Download exact pinned client DB2 tables
        env:
          CLIENT_BUILD: "1.60.1.70425"
        shell: bash
        run: |
          set -euo pipefail
          ua="forever-sim-shaman-equipment (github.com/dosibjrn/forever-sim)"
          curl --fail --location --retry 3 --retry-all-errors --user-agent "$ua" \
            "https://wago.tools/db2/SkillLine/csv?build=$CLIENT_BUILD" \
            --output "$RUNNER_TEMP/SkillLine.csv"
          curl --fail --location --retry 3 --retry-all-errors --user-agent "$ua" \
            "https://wago.tools/db2/SkillRaceClassInfo/csv?build=$CLIENT_BUILD" \
            --output "$RUNNER_TEMP/SkillRaceClassInfo.csv"
          python tools/import_shaman_equipment.py \
            "$RUNNER_TEMP/SkillLine.csv" "$RUNNER_TEMP/SkillRaceClassInfo.csv"
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/shaman-equipment-skills.json").read_text())
          print("PINNED_CLIENT_BUILD", data["client_build"])
          print("SHAMAN_RACE_IDS", data["race_ids"])
          print("SHAMAN_SKILL_LEVELS")
          for skill in data["skills"]:
              if skill["min_level"] is not None:
                  print(f'{skill["skill_id"]}\t{skill["name"]}\t{skill["min_level"]}')
          print("RACE_SPECIFIC_OR_UNAVAILABLE")
          for skill in data["skills"]:
              if skill["min_level"] is None:
                  print(f'{skill["skill_id"]}\t{skill["name"]}\t{skill["per_race_min_level"]}')
          PY
      - name: Upload normalized source projection and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shaman-equipment-skills-${{ github.sha }}
          path: |
            data/manifest.json
            data/shaman-equipment-skills.json
            data/shaman-equipment-skills.manifest.json
          if-no-files-found: error
          retention-days: 30
