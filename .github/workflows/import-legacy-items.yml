name: Import pinned legacy Wowhead item facts

on:
  push:
    branches: [feature/get-options-catalog]
    paths:
      - tools/export_legacy_wowhead_items.py
      - .github/workflows/import-legacy-items.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the pinned 2026-09-29 Wowhead decisions database
        run: |
          curl --fail --location --retry 3 --output /tmp/legacy-items.sqlite \
            https://raw.githubusercontent.com/dosibjrn/mage-level-sim/3bd46df7e3b95a8a3bfdc7455de659341a905826/data/forever/catalogue/items_2026-09-29.sqlite
      - name: Export deterministic native source facts
        run: |
          python3 tools/export_legacy_wowhead_items.py \
            /tmp/legacy-items.sqlite data/legacy-wowhead-items.jsonl
          wc -l data/legacy-wowhead-items.jsonl
      - name: Check in the generated snapshot on the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/legacy-wowhead-items.jsonl
          if ! git diff --cached --quiet; then
            git commit -m 'data(options): import pinned Wowhead item required levels and provenance'
            git push origin HEAD:feature/get-options-catalog
          fi
