# Temporary, branch-scoped rustfmt normalisation for upstream integration.
# Do not modify main, run only for the branch named below.
name: Format upstream integration
on:
  push:
    branches:
      - integrate/upstream-2026-11-04
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt
      - name: Format merged Rust without modifying mechanics
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          # Formatting must not change non-Rust files.
          if git diff --name-only | grep -v '\.rs$'; then
            echo "::error::rustfmt changed unexpected non-Rust files"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.rs'
          git commit -m "style: rustfmt upstream integration and existing Forever native files"
          git push origin HEAD:refs/heads/integrate/upstream-2026-11-04
