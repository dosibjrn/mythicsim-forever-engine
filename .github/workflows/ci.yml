name: Engine checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No toolchain input: the action installs the version pinned in rust-toolchain.toml.
      - name: Install Rust from rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt, clippy
          target: wasm32-unknown-unknown, wasm32-wasip1
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Query native Shaman L20 item options
        run: |
          cargo run --locked -- item-options --class shaman --level 20 --spec unrestricted --slot all > /tmp/shaman-item-options.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/shaman-item-options.json").read_text())
          assert result["status"] == "ok", result
          assert result["required_level_supported"], result
          assert result["items"], result
          assert all(item["required_level"] <= 20 for item in result["items"]), result
          print("SHAMAN_L20_NATIVE_ITEM_OPTIONS", len(result["items"]))
          PY
      - name: Check formatting of changed Rust modules
        run: rustfmt --check --edition 2021 src/data.rs src/prepare/items.rs
      - name: Run Shaman native item-options regression tests
        run: cargo test --locked shaman_
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build --locked --target wasm32-wasip1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.6'
          cache: false
      - run: go test ./...
        working-directory: tools/matched-go
      - run: go vet ./...
        working-directory: tools/matched-go
      - run: python3 -m unittest discover -s tools -p '*_test.py'
      - run: python3 tools/rust_data.py check
      - run: python3 tools/inventory.py check
      - run: python3 tools/prepared_v2.py check
      - run: python3 tools/upstream.py check
      # Keep the repository-wide baseline visible, but run it last so existing
      # formatting debt cannot skip the production, data, and regression checks.
      - run: cargo fmt -- --check

  # The test suite is most of the run, so it gets its own job and the
  # other checks report while it is still going.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Debug info only slows the test build in CI; a 4 core run compiled
      # in 93 s without it against 125 s with it. Local builds keep it.
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No toolchain input: the action installs the version pinned in rust-toolchain.toml.
      - name: Install Rust from rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify native Paladin L20 source context before broad suite
        run: cargo test --locked --test native_player_context
      - run: cargo test --locked
