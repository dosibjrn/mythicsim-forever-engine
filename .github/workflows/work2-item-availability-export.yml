name: Work2 temporary item availability export

on:
  push:
    branches: ["work/work2-priest-p3-native-item-options-isolated-20261104"]
    paths:
      - ".github/workflows/work2-item-availability-export.yml"

permissions:
  contents: write

jobs:
  export-item-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact MythicSim item source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Checkout the current Forever source snapshot with LFS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: dosibjrn/forever-sim
          ref: main
          path: forever-sim
          lfs: true
          persist-credentials: false

      - name: Export generic source-backed item requirements for native item IDs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import sqlite3
          import subprocess

          native_path = pathlib.Path("data/items.jsonl")
          native_bytes = native_path.read_bytes()
          native_ids = {
              int(json.loads(line)["id"])
              for line in native_bytes.decode("utf-8").splitlines()
              if line.strip()
          }
          db_path = pathlib.Path("forever-sim/data/forever/catalogue/items_2026-09-29.sqlite")
          db_bytes = db_path.read_bytes()
          if db_bytes.startswith(b"version https://git-lfs.github.com/spec/v1"):
              raise SystemExit("LFS item catalogue was not hydrated")
          db = sqlite3.connect(f"file:{db_path.resolve()}?mode=ro", uri=True)
          db.row_factory = sqlite3.Row
          columns = {row[1] for row in db.execute("PRAGMA table_info(items)")}
          required = {"item_id", "required_level", "required_level_origin"}
          if not required <= columns:
              raise SystemExit(f"item catalogue missing columns: {sorted(required-columns)}")

          acquisition = {}
          has_acquisition = db.execute(
              "SELECT 1 FROM sqlite_master WHERE type='table' AND name='item_acquisition_min_level'"
          ).fetchone() is not None
          if has_acquisition:
              acq_columns = {row[1] for row in db.execute("PRAGMA table_info(item_acquisition_min_level)")}
              if {"item_id", "min_level"} <= acq_columns:
                  for row in db.execute(
                      "SELECT item_id, MAX(min_level) AS min_level "
                      "FROM item_acquisition_min_level GROUP BY item_id"
                  ):
                      acquisition[int(row["item_id"])] = int(row["min_level"])

          select = [
              "item_id", "required_level", "required_level_origin",
              "source_type", "source_name", "source_url",
          ]
          select = [name for name in select if name in columns]
          rows = []
          for row in db.execute(
              "SELECT " + ", ".join(select) + " FROM items WHERE item_id > 0 ORDER BY item_id"
          ):
              item_id = int(row["item_id"])
              if item_id not in native_ids or row["required_level"] is None:
                  continue
              rows.append({
                  "item_id": item_id,
                  "required_level": int(row["required_level"]),
                  "required_level_origin": str(row["required_level_origin"]),
                  "source_type": str(row["source_type"] or "") if "source_type" in row.keys() else "",
                  "source_name": str(row["source_name"] or "") if "source_name" in row.keys() else "",
                  "source_url": str(row["source_url"] or "") if "source_url" in row.keys() else "",
                  "acquisition_min_level": acquisition.get(item_id),
              })

          manifest_path = pathlib.Path("forever-sim/data/forever/catalogue/items_2026-09-29.manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          forever_sha = subprocess.check_output(
              ["git", "-C", "forever-sim", "rev-parse", "HEAD"], text=True
          ).strip()
          output = {
              "schema_version": 1,
              "source": {
                  "repository": "dosibjrn/forever-sim",
                  "ref": "main",
                  "commit": forever_sha,
                  "database_path": "data/forever/catalogue/items_2026-09-29.sqlite",
                  "database_sha256": hashlib.sha256(db_bytes).hexdigest(),
                  "manifest": manifest,
              },
              "native_item_source": {
                  "repository": "dosibjrn/mythicsim-forever-engine",
                  "commit": "${{ github.sha }}",
                  "path": "data/items.jsonl",
                  "sha256": hashlib.sha256(native_bytes).hexdigest(),
                  "native_item_count": len(native_ids),
              },
              "availability_item_count": len(rows),
              "has_acquisition_min_level_table": has_acquisition,
              "items": rows,
          }
          out = pathlib.Path("item-availability-export.json")
          out.write_text(json.dumps(output, sort_keys=True, separators=(",", ":")) + "\\n", encoding="utf-8")

          origin_codes = {
              "observed": 0,
              "inferred_median": 1,
              "inferred_interpolated": 2,
              "source_confirmed_no_requirement": 3,
          }
          tsv_path = pathlib.Path("data/item_availability.tsv")
          with tsv_path.open("w", encoding="utf-8", newline="") as handle:
              for row in rows:
                  code = origin_codes.get(row["required_level_origin"])
                  if code is None:
                      raise SystemExit(f"unknown required-level origin: {row['required_level_origin']}")
                  acquisition_level = row["acquisition_min_level"]
                  handle.write(
                      f"{row['item_id']}\\t{row['required_level']}\\t{code}\\t"
                      f"{'' if acquisition_level is None else acquisition_level}\\n"
                  )

          metadata = {
              "schema_version": 1,
              "source": {
                  "repository": "dosibjrn/forever-sim",
                  "ref": "main",
                  "commit": forever_sha,
                  "database_path": "data/forever/catalogue/items_2026-09-29.sqlite",
                  "database_sha256": hashlib.sha256(db_bytes).hexdigest(),
                  "catalogue_hash": manifest.get("catalogue_hash"),
                  "availability_floor_model": manifest.get("availability_floor_model"),
                  "source_type": "wowhead_listview",
                  "source_name": "Forever Items",
                  "source_url_template": "https://www.wowhead.com/forever/item={item_id}",
              },
              "native_item_source": output["native_item_source"],
              "availability_item_count": len(rows),
              "acquisition_min_level_supported": bool(has_acquisition and acquisition),
              "required_level_origin_codes": {str(value): key for key, value in origin_codes.items()},
          }
          metadata_path = pathlib.Path("data/item_availability_manifest.json")
          metadata_path.write_text(
              json.dumps(metadata, sort_keys=True, separators=(",", ":")) + "\\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "native_item_count": len(native_ids),
              "availability_item_count": len(rows),
              "acquisition_rows": len(acquisition),
              "forever_main": forever_sha,
              "catalogue_hash": manifest.get("catalogue_hash"),
              "tsv_bytes": tsv_path.stat().st_size,
              "manifest_bytes": metadata_path.stat().st_size,
          }, sort_keys=True))
          PY

      - name: Upload one-off source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: work2-native-item-availability
          path: |
            item-availability-export.json
            data/item_availability.tsv
            data/item_availability_manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit the source-backed native availability snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/item_availability.tsv data/item_availability_manifest.json
          git commit -m "data(native): add source-backed item availability"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
