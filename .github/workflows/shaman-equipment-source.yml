name: Shaman equipment source import

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download DB2 exports for the pinned client build
        shell: bash
        run: |
          set -euo pipefail
          build="$(python3 -c 'import json; print(json.load(open("data/manifest.json", encoding="utf-8"))["client_build"])')"
          for table in SkillLine SkillRaceClassInfo; do
            url="https://wago.tools/db2/${table}/csv?build=${build}"
            curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
              --user-agent "MythicSim source importer" "$url" -o "/tmp/${table}.csv"
            test -s "/tmp/${table}.csv"
          done
          python3 -m unittest discover -s tools -p 'import_shaman_equipment_test.py'
          python3 tools/import_shaman_equipment.py /tmp/SkillLine.csv /tmp/SkillRaceClassInfo.csv
